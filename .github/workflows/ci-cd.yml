name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Basket.UnitTests
        run: dotnet restore tests/Basket.UnitTests/Basket.UnitTests.csproj

      - name: Test Basket.UnitTests
        run: dotnet test tests/Basket.UnitTests/Basket.UnitTests.csproj --no-restore

      - name: Restore Ordering.UnitTests
        run: dotnet restore tests/Ordering.UnitTests/Ordering.UnitTests.csproj

      - name: Test Ordering.UnitTests
        run: dotnet test tests/Ordering.UnitTests/Ordering.UnitTests.csproj --no-restore

  docker-build-push:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Catalog.API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Catalog.API/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/catalog-api:latest
            ghcr.io/${{ github.repository }}/catalog-api:${{ github.sha }}

      - name: Build and push Basket.API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Basket.API/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/basket-api:latest
            ghcr.io/${{ github.repository }}/basket-api:${{ github.sha }}

      - name: Build and push Ordering.API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Ordering.API/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ordering-api:latest
            ghcr.io/${{ github.repository }}/ordering-api:${{ github.sha }}

      - name: Scan Catalog.API image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/${{ github.repository }}/catalog-api:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan Basket.API image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/${{ github.repository }}/basket-api:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan Ordering.API image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/${{ github.repository }}/ordering-api:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  deploy:
    needs: docker-build-push
    if: github.event_name == 'push'
    runs-on: vm103
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to k3s
        run: |
          kubectl apply -f k8s/
          kubectl rollout restart deployment/catalog-api -n default
          kubectl rollout restart deployment/basket-api -n default
          kubectl rollout restart deployment/ordering-api -n default

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/catalog-api -n default --timeout=120s
          kubectl rollout status deployment/basket-api -n default --timeout=120s
          kubectl rollout status deployment/ordering-api -n default --timeout=120s

      - name: Smoke test Catalog API
        run: |
          kubectl run smoke-catalog-api \
            --namespace=default \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --rm \
            --attach \
            --command -- \
            sh -c 'for i in $(seq 1 12); do curl --fail --silent --show-error --max-time 5 http://catalog-api:8080/health && exit 0; echo "Catalog not ready; retrying..."; sleep 5; done; exit 1'

      - name: Smoke test Basket API
        run: |
          kubectl run smoke-basket-api \
            --namespace=default \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --rm \
            --attach \
            --command -- \
            sh -c 'for i in $(seq 1 12); do curl --http2-prior-knowledge --fail --silent --show-error --max-time 5 http://basket-api:8080/health && exit 0; echo "Basket not ready; retrying..."; sleep 5; done; exit 1'

      - name: Smoke test Ordering API
        run: |
          kubectl run smoke-ordering-api \
            --namespace=default \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --rm \
            --attach \
            --command -- \
            sh -c 'for i in $(seq 1 12); do curl --fail --silent --show-error --max-time 5 http://ordering-api:8080/health && exit 0; echo "Ordering not ready; retrying..."; sleep 5; done; exit 1'