services:
  catalog-db:
    image: ankane/pgvector:latest
    container_name: catalog-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: catalogdb
    ports:
      - "5432:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data

  ordering-db:
    image: ankane/pgvector:latest
    container_name: ordering-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: orderingdb
    ports:
      - "5433:5432"
    volumes:
      - ordering-db-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7
    container_name: redis

  catalog-api:
    build:
      context: .
      dockerfile: src/Catalog.API/Dockerfile
    container_name: catalog-api
    depends_on:
      - catalog-db
      - rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__catalogdb: "Host=catalog-db;Port=5432;Database=catalogdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres_dev_password}"
      ConnectionStrings__EventBus: "amqp://guest:guest@rabbitmq:5672"
    ports:
      - "8080:8080"

  basket-api:
    build:
      context: .
      dockerfile: src/Basket.API/Dockerfile
    container_name: basket-api
    depends_on:
      - redis
      - rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__redis: "redis:6379"
      ConnectionStrings__EventBus: "amqp://guest:guest@rabbitmq:5672"
    ports:
      - "8081:8080"

  ordering-api:
    build:
      context: .
      dockerfile: src/Ordering.API/Dockerfile
    container_name: ordering-api
    depends_on:
      - ordering-db
      - rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__orderingdb: "Host=ordering-db;Port=5432;Database=orderingdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres_dev_password}"
      ConnectionStrings__EventBus: "amqp://guest:guest@rabbitmq:5672"
      Identity__Url: "http://identity-api"
    ports:
      - "8082:8080"

volumes:
  catalog-db-data:
  ordering-db-data: