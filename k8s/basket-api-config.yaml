apiVersion: v1
kind: ConfigMap
metadata:
  name: basket-api-config
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  ConnectionStrings__redis: "redis:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: basket-api-secret
type: Opaque
stringData:
  ConnectionStrings__EventBus: "amqp://guest:guest@rabbitmq:5672"
