apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: ordering-api }
  template:
    metadata:
      labels: { app: ordering-api }
    spec:
      containers:
        - name: ordering-api
          image: ghcr.io/farhad-mm/eshop-devops-project/ordering-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: ordering-api-config }
            - secretRef: { name: ordering-api-secret }
---
apiVersion: v1
kind: Service
metadata:
  name: ordering-api
spec:
  selector: { app: ordering-api }
  ports:
    - port: 8080
      targetPort: 8080