apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-db
spec:
  replicas: 1
  selector:
    matchLabels: { app: catalog-db }
  template:
    metadata:
      labels: { app: catalog-db }
    spec:
      containers:
        - name: catalog-db
          image: ankane/pgvector:latest
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres_dev_password"
            - name: POSTGRES_DB
              value: "catalogdb"
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-db
spec:
  selector: { app: catalog-db }
  ports:
    - port: 5432
      targetPort: 5432
---
